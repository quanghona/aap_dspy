name: Build test and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Called by publish_pypi.yml. There is no cross-workflow `needs` in GitHub
  # Actions, so reusing the validate/build jobs for a release gate has to go
  # through workflow_call rather than a job reference. Renaming or removing
  # this trigger breaks the release workflow.
  workflow_call:
    inputs:
      gate_only:
        description: >-
          Run only Lint/Test/Scan and Build, skipping the TestPyPI deploy and
          its smoke test. Set by publish_pypi.yml, which publishes to real PyPI
          and must not touch TestPyPI on the release path.
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.10" # minimum supported version

jobs:
  validate:
    name: Lint, Test and Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write # CodeQL SARIF upload
    steps:
      # ---------- 1. Environment ----------
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        # --no-sources is required, not defensive: [tool.uv.sources] pins torch
        # to an absolute aarch64 wheel path (/data/install/...) that does not
        # exist on x86_64 runners, and aap-core to the explicit test-pypi index.
        # Ignoring sources makes both resolve from PyPI (aap-core>=0.1.0).
        # Note uv sync does NOT re-resolve: the committed uv.lock is the source
        # of truth, so keep its aap-core pin current (>=0.3.0) when the code
        # starts using newer aap_core modules.
        run: uv sync --no-sources --group dev --group lint

      # ---------- 2. Lint ----------
      # This repo declares a `lint` group (ruff==0.14.0), so ruff runs from the
      # synced env like aap_core, not via uvx as in the langchain/llamaindex repos.
      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # ---------- 3. Tests ----------
      # Offline suite: test_chain.py uses a dspy.LM subclass that only records
      # messages and stubs the Hugging Face lookup, and test_retriever.py uses
      # _MockRetrieve/_MockEmbeddings, so no API keys or external services are
      # required. No NLTK punkt_tab step here: the tests never call the prompt
      # augmenter, and aap_core's prompt_augmenter self-heals punkt_tab at call
      # time, not import time.
      - name: Run tests
        run: uv run pytest tests -v

      # ---------- 4. CodeQL security scan ----------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # ---------- 5. Build ----------
      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        # Consumed by publish_pypi.yml when this workflow runs as a reusable
        # call: artifacts are scoped to the whole run, so the release job
        # downloads this one by name. Do not rename it casually.
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy-test:
    name: Deploy to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    # `!= true` rather than `!inputs.gate_only`: on a push trigger the inputs
    # context is empty, and comparing against true keeps that path running.
    # When this job is skipped, test-pypi skips too via its `needs`.
    if: ${{ inputs.gate_only != true }}
    permissions:
      id-token: write # mandatory for OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # ---------- 6. Test PyPI ----------
      # Trusted publishing (OIDC): no password. Setting a password would force
      # token auth and silently bypass the trusted publisher configured on TestPyPI.
      # skip-existing is intentional here: PyPI/TestPyPI reject a filename that was
      # already uploaded, so re-running CI on an unchanged version must not fail.
      # Keep it OFF for the real PyPI job so genuine duplicates fail loudly.
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  test-pypi:
    name: Test TestPyPI package
    runs-on: ubuntu-latest
    needs: deploy-test
    steps:
      - name: Wait for TestPyPI propagation
        run: sleep 30

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Test package installation and import
        # Installs WITH dependencies: aap_dspy imports aap_core at module level,
        # whose __init__ imports policy_trainer, which imports torch/wandb — so a
        # --no-deps install cannot be imported at all.
        # PyPI stays the default index; TestPyPI is an extra. --index-strategy
        # unsafe-best-match is REQUIRED: uv's default first-index strategy clamps
        # each package to the first index containing its NAME, and TestPyPI hosts
        # stale squats (a2a-sdk==0.2.0a1) plus partial mirrors (aap-core), so
        # under first-index either the deps or the newer aap-core would fail to
        # resolve. With best-match the exact-pinned aap-dspy comes from
        # TestPyPI while deps (a2a-sdk, torch, ...) resolve from PyPI. Pinning
        # the exact version keeps the smoke test honest: if the TestPyPI upload
        # did not land, the install fails instead of passing off an older copy.
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          uv venv /tmp/smoke --python "$PYTHON_VERSION"
          uv pip install --python /tmp/smoke \
            --index-strategy unsafe-best-match \
            --extra-index-url https://test.pypi.org/simple/ \
            "aap-dspy==${VERSION}"
          # Assert the package exposes __version__ and it matches pyproject.toml.
          /tmp/smoke/bin/python -c "import aap_dspy; assert aap_dspy.__version__ == '${VERSION}', aap_dspy.__version__; print('aap_dspy', aap_dspy.__version__)"
